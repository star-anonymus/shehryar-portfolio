name: Daily LinkedIn drafts

# 03:00 UTC = 08:00 PKT. GitHub's scheduler can lag by several minutes.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Activity window in days"
        required: false
        default: "7"
      count:
        description: "Number of drafts"
        required: false
        default: "3"
      steer:
        description: "Optional instruction for the writer"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate drafts
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
          COUNT: ${{ inputs.count || '3' }}
          STEER: ${{ inputs.steer || '' }}
        run: node scripts/fetch-daily-drafts.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content; then
            echo "No draft changes."
            exit 0
          fi
          git add content
          git commit -m "chore(studio): daily LinkedIn drafts for $(date -u +%Y-%m-%d)"
          git push
